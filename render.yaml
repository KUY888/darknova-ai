services:
  - type: web
    name: darknova-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    envVars:
      - {key: ENV, value: production}
      - {key: TRUST_PROXY, value: "1"}
      - {key: ENABLE_SCAN, value: "0"}
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: AI_MODEL, value: openai/gpt-oss-120b}
      - {key: SECRET_KEY, generateValue: true}
      - {key: AI_API_KEY, sync: false}
      - {key: APP_PASSWORD, sync: false}
