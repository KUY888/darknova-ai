name: Build DARKNOVA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/darknova/ai
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF_INNER'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DARKNOVA-AI"
          include(":app")
          EOF_INNER

          cat > build.gradle <<'EOF_INNER'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_INNER

          cat > app/build.gradle <<'EOF_INNER'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.darknova.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darknova.ai'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF_INNER

          cat > app/src/main/res/values/styles.xml <<'EOF_INNER'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8A2BE2</item>
                  <item name="android:statusBarColor">#121016</item>
                  <item name="android:navigationBarColor">#121016</item>
              </style>
          </resources>
          EOF_INNER

          cat > app/src/main/AndroidManifest.xml <<'EOF_INNER'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="DARKNOVA AI"
                  android:usesCleartextTraffic="false"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF_INNER

          cat > app/src/main/java/com/darknova/ai/MainActivity.java <<'EOF_INNER'
          package com.darknova.ai;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://darknova-ai.onrender.com/");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  WebView webView = (WebView) findViewById(android.R.id.content);
                  super.onBackPressed();
              }
          }
          EOF_INNER

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.10.2
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARKNOVA-AI
          path: app/build/outputs/apk/debug/app-debug.apk
